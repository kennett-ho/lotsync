name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      # PYTHONPATH=.. resolves the `from lotsync.x import y` convention
      # only because Actions checks out into a directory named after the
      # repo (…/work/lotsync/lotsync). If this repo is ever renamed
      # (e.g. → dealerdoh), this job needs the same symlink trick
      # render.yaml's startCommand uses.
      - name: Run backend test suite
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -p "test_*.py"

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Sprint 03: the same behavioral suite, run against a disposable
    # PostgreSQL service container (never the live Supabase dev
    # project). One test is engine-specific and self-skips -- see
    # tests/test_database_slice1.py's RepositoryMigrationTest.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      # Same PYTHONPATH note as the sqlite job above.
      - name: Run backend test suite against PostgreSQL
        env:
          PYTHONPATH: ..
          DATABASE_ENGINE: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Sprint 14 (Rail J): bundle-size regression gate against the
      # real build output. Ceilings + derivation: PERFORMANCE.md;
      # stdlib-only, no install step needed.
      - name: Bundle budget (gate)
        working-directory: ${{ github.workspace }}
        run: python3 tools/check_bundle_budget.py

  # Sprint 13 (Rails H + I): the security scanning gate. The secret scan
  # and the production-dependency audit are hard gates (they fail the
  # build); the full-tree dependency audits are advisory (they surface
  # transitive/dev-only findings for the triaged exception register
  # without red-X-ing every PR on an unreachable notice -- the standing
  # nanoid dev-only classification is the model). See
  # V1_1_RELEASE_READINESS.md §5.I and SECURITY_AUDIT.md.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Hard gate: no credential-shaped material in the tracked tree.
      # stdlib-only, no install step needed.
      - name: Secret scan (tracked tree)
        run: python tools/secret_scan.py --verbose

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Advisory: Python dependency advisories for the triaged register.
      - name: Python dependency audit (advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Hard gate: runtime-reachable (production) dependencies must be
      # free of High/Critical advisories. Build-only devDependencies
      # (e.g. the standing nanoid finding, reachable only through vite)
      # are excluded here and covered by the advisory audit below.
      - name: npm audit -- production dependencies (gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Advisory: the full tree, including devDependencies, for the register.
      - name: npm audit -- full tree (advisory)
        working-directory: frontend
        continue-on-error: true
        run: npm audit
