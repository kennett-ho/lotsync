name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      # PYTHONPATH=.. resolves the `from lotsync.x import y` convention
      # only because Actions checks out into a directory named after the
      # repo (…/work/lotsync/lotsync). If this repo is ever renamed
      # (e.g. → dealerdoh), this job needs the same symlink trick
      # render.yaml's startCommand uses.
      - name: Run backend test suite
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
